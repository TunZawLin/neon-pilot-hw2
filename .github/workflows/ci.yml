name: Test NEON PILOT

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Test HTTP, readiness, security headers, and browser asset MIME types
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test game and gesture controller rules
        run: node --test tests/game.test.mjs tests/app.test.mjs
      - name: Check browser scripts
        run: |
          node --check static/app.js
          node --check static/game-core.js
          node --check static/tracker-worker.js
          node --check static/diagnostics.js
